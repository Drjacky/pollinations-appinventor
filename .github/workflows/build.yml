name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Unit tests (mock server, no network)
        run: ./tools/test.sh
      - name: Build extension
        run: ant extensions
      - name: Build sample project
        run: python3 tools/make_aia.py
      - uses: actions/upload-artifact@v4
        with:
          name: pollinations-appinventor
          path: |
            out/*.aix
            sample/*.aia
